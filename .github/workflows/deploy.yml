name: CI and deploy to GitHub Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time. A newer push waits for the running deploy instead of
# cancelling it half way through.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # STATIC_EXPORT and NEXT_BASE_PATH are read by next.config.ts. The site is a
      # project page, served from https://<owner>.github.io/<repo>/, so every
      # link and asset needs the repository name as a prefix.
      - name: Build static export
        run: npm run build
        env:
          STATIC_EXPORT: 'true'
          NEXT_BASE_PATH: /${{ github.event.repository.name }}

      # Pull requests stop after the build above: they prove the site compiles
      # but must never publish.
      - name: Upload site artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
